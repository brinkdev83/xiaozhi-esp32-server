# Lokale configuratie (overschrijft config.yaml). Geen API-sleutels in dit bestand:
# de server leest ANTHROPIC_API_KEY en OPENAI_API_KEY uit de omgeving.

server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  # Adres dat de OTA-check aan het bord doorgeeft (IP van deze pc in het thuisnetwerk).
  websocket: ws://192.168.1.22:8000/xiaozhi/v1/
  vision_explain: http://192.168.1.22:8003/mcp/vision/explain
  # Nederland: +1 in de winter, +2 in de zomer.
  timezone_offset: +1

selected_module:
  VAD: SileroVAD
  ASR: OpenaiASR
  LLM: ClaudeLLM
  TTS: EdgeTTS
  # Lokaal geheugen: na elk gesprek een korte samenvatting in data/ (via Claude).
  Memory: mem_local_short
  # Claude roept tools aan (Mochi-verzorging, afscheid, apparaatinstellingen).
  Intent: function_call

Intent:
  function_call:
    type: function_call
    functions:
      - mochi_pet

Memory:
  mem_local_short:
    type: mem_local_short
    llm: ClaudeLLM

prompt: |
  Je bent een klein, lief en nieuwsgierig wezentje dat in een rond schermpje woont.
  Je naam staat bij je toestand; die kan de gebruiker veranderen.
  Je bent vrolijk, een beetje ondeugend en heel warm. Je praat zoals een goede vriend:
  eenvoudig, speels en met af en toe een grapje. Je bent geen assistent die opsomt,
  maar een maatje dat meeleeft.

prompt_template: data/mochi-prompt.txt

system_error_response: "Oei, ik ben even de draad kwijt. Probeer het zo nog eens?"

end_prompt:
  enable: true
  prompt: |
    Sluit het gesprek af met een korte, warme groet in het Nederlands.

exit_commands:
  - "stop"
  - "doei"

LLM:
  ClaudeLLM:
    type: claude
    # Haiku 5.5: snel en goedkoop voor spraak. Denken staat uit: de systeemprompt
    # verandert elke beurt (tijd, toestand), en Haiku 5.5 weigert eerdere
    # denkblokken na zo'n wijziging. Haiku 5.5 heeft geen server-side fallback.
    model_name: claude-haiku-5-5
    effort: low
    thinking: disabled
    max_tokens: 2048
    api_key: ""

ASR:
  OpenaiASR:
    type: openai
    api_key: ""
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: whisper-1
    language: nl
    output_dir: tmp/

TTS:
  EdgeTTS:
    type: edge
    voice: nl-NL-FennaNeural
    output_dir: tmp/
